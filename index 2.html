<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>伊利小編購線上訂餐</title>
<style>
:root{--bg:#fff;--fg:#2b2b28;--mut:#8a877f;--line:#ebe8e1;--soft:#f7f5f0;--ac:#7c8b6f;--acf:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--fg:#eeece6;--mut:#a09d94;--line:#333330;--soft:#262624;--ac:#a3b295;--acf:#1c1c1a}}
:root[data-theme="dark"]{--bg:#1c1c1a;--fg:#eeece6;--mut:#a09d94;--line:#333330;--soft:#262624;--ac:#a3b295;--acf:#1c1c1a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.w{max-width:720px;margin:0 auto;padding:0 20px}
h1,h2{font-family:"Noto Serif TC",Georgia,serif;font-weight:500;margin:0}
.hero{text-align:center;padding:56px 0 32px}
.hero small{letter-spacing:.3em;color:var(--mut)}
.hero h1{font-size:30px;margin:8px 0 6px}.hero p{color:var(--mut);margin:0 0 24px}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--bg)}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 16px}
button.on,button.pri{background:var(--ac);color:var(--acf);border-color:var(--ac)}
button.pri{width:100%;padding:12px;border-radius:12px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);margin-top:4px}
label{display:block;font-size:13px;color:var(--mut);margin-top:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.tabs button{white-space:nowrap}
.item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item b{font-weight:500}.item span{color:var(--mut);font-size:13px}
.item button{padding:6px 14px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:3}
.bar .w{padding:0}
main{padding-bottom:110px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:5}
.sheet.show{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:720px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.grp{margin-top:14px}.grp>div{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;font-size:14px}
.q button{padding:2px 10px}
.tot{font-size:18px;text-align:right;margin:12px 0}
.o{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.ft{text-align:center;color:var(--mut);font-size:12px;padding:20px 0 120px}
.ft a{color:inherit;text-decoration:underline;cursor:pointer}
.hide{display:none}
</style></head><body>
<div class="w" id="app">
<section class="hero"><small>YILI ONLINE ORDER</small><h1>伊利小編購</h1><p>線上訂餐・預約取餐更輕鬆</p>
<div class="card" style="text-align:left">
<div class="seg" id="mode"><button class="on" data-v="外帶">外帶</button><button data-v="內用">內用</button></div>
<label style="margin-top:0">預約時間<div style="display:flex;gap:8px"><select id="wd"></select><select id="wt"></select></div></label><input type="hidden" id="when"><div style="font-size:12px;color:var(--mut);margin-top:6px">僅開放週一至週五，下午 4:00 至 7:00 預約</div>
<button class="pri" style="margin-top:14px" onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">開始點餐</button></div></section>
<main id="menu"><h2>菜單</h2><div class="tabs" id="tabs"></div><div id="list"></div></main>
<div class="ft">© 伊利小編購</div>
</div>
<div class="bar"><div class="w" style="max-width:680px;margin:0 auto"><button class="pri" id="cartBtn" onclick="openCart()">購物車（0）　NT$0</button></div></div>

<div class="sheet" id="sOpt"><div>
<h2 id="oT"></h2><div id="oG"></div>
<label>備註<input id="oN" placeholder="例如：麵煮軟一點"></label>
<div class="tot" id="oP"></div><button class="pri" onclick="addCart()">加入購物車</button>
<button style="width:100%;margin-top:8px;border:0" onclick="closeS()">取消</button></div></div>

<div class="sheet" id="sCart"><div>
<h2>購物車</h2><div id="cL"></div><div class="tot" id="cT"></div>
<div id="cF">
<label>姓名<input id="fN" autocomplete="name"></label>
<label>手機<input id="fP" type="tel" autocomplete="tel"></label>
<label>Email（選填）<input id="fE" type="email" autocomplete="email"></label>
<label>訂單備註<textarea id="fM" rows="2"></textarea></label>
<div id="err" style="color:#c0554a;font-size:13px;margin-top:8px"></div>
<button class="pri" style="margin-top:12px" id="sub" onclick="submitOrder()">送出訂單</button></div>
<button style="width:100%;margin-top:8px;border:0" onclick="closeS()">繼續點餐</button></div></div>

<div class="sheet" id="sOk"><div style="text-align:center">
<h2>訂單已送出 🌿</h2><p id="okT" style="color:var(--mut)"></p>
<textarea id="okS" rows="6" readonly style="text-align:left"></textarea>
<button style="margin-top:10px" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('okS').value)">複製訂單內容</button>
<button class="pri" style="margin-top:10px" onclick="closeS()">完成</button></div></div>

<div class="sheet" id="sAdm"><div>
<h2>店家後台</h2><div id="aMsg" style="color:var(--mut);font-size:13px;margin:6px 0"></div>
<button id="csv" class="hide" onclick="exportCsv()">匯出 CSV（可匯入 Google 試算表）</button>
<div id="aL"></div>
<button style="width:100%;margin-top:12px;border:0" onclick="closeS()">關閉</button></div></div>

let cat='main',cart=[],mode='外帶',cur=null,db=null,user=null,unsub=null,orders=[];
const pad=n=>String(n).padStart(2,'0');
const WD='日一二三四五六',SL=[];for(let h=16;h<=19;h++)for(const m of [0,15,30,45]){if(h<19||m===0)SL.push(pad(h)+':'+pad(m))}
const slot=(d,t)=>{const [h,m]=t.split(':');return new Date(d.getFullYear(),d.getMonth(),d.getDate(),+h,+m)};
function fillDates(){const now=new Date(),lim=now.getTime()+18e5,sel=$('wd');sel.innerHTML='';let n=0;for(let i=0;i<28&&n<10;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i),g=d.getDay();if(g<1||g>5||!SL.some(t=>slot(d,t)>lim))continue;const o=document.createElement('option');o.value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());o.textContent=`${d.getMonth()+1}月${d.getDate()}日（週${WD[g]}）`;sel.append(o);n++}fillTimes()}
function fillTimes(){const v=$('wd').value,t=$('wt');t.innerHTML='';if(v){const [y,m,d]=v.split('-').map(Number),day=new Date(y,m-1,d),lim=Date.now()+18e5;SL.filter(s=>slot(day,s)>lim).forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent='下午 '+(+s.slice(0,2)-12)+s.slice(2);t.append(o)})}sync()}
function sync(){$('when').value=$('wd').value&&$('wt').value?$('wd').value+'T'+$('wt').value:''}
$('wd').onchange=fillTimes;$('wt').onchange=sync;fillDates();
$('mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.v;[...$('mode').children].forEach(x=>x.classList.toggle('on',x===b))};
function renderTabs(){$('tabs').innerHTML='';CATS.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.className=k===cat?'on':'';b.onclick=()=>{cat=k;renderTabs()};$('tabs').append(b)});
$('list').innerHTML='';MENU[cat].forEach(([n,p,im],i)=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div style="display:flex;gap:12px;align-items:center"><img src="${im}" width="64" height="64" style="border-radius:12px;object-fit:cover" alt=""><div><b>${esc(n)}</b><br><span>NT$${p}</span></div></div>`;const b=document.createElement('button');b.textContent='加入 ＋';b.onclick=()=>openOpt(i);d.append(b);$('list').append(d)})}
function openOpt(i){const [n,p,,gk]=MENU[cat][i];cur={name:n,base:p,g:gk,sel:{}};G[gk].forEach(g=>{cur.sel[g.n]=g.m?[]:[g.c[0][0]]});$('oT').textContent=n;$('oN').value='';drawOpt();$('sOpt').classList.add('show')}
function optPrice(){let p=cur.base;G[cur.g].forEach(g=>g.c.forEach(([l,x])=>{if(cur.sel[g.n].includes(l))p+=x}));return p}
function drawOpt(){const box=$('oG');box.innerHTML='';G[cur.g].forEach(g=>{const s=document.createElement('div');s.className='grp';s.innerHTML=`<b>${g.n}</b>${g.m?' <span style="color:var(--mut);font-size:12px">可複選</span>':''}`;const w=document.createElement('div');g.c.forEach(([l,x])=>{const b=document.createElement('button');const on=cur.sel[g.n].includes(l);b.className=on?'on':'';b.textContent=l+(x?` +${x}`:'');b.onclick=()=>{const a=cur.sel[g.n];if(g.m){on?a.splice(a.indexOf(l),1):a.push(l)}else cur.sel[g.n]=[l];drawOpt()};w.append(b)});s.append(w);box.append(s)});$('oP').textContent='NT$'+optPrice()}
function addCart(){const opts=Object.values(cur.sel).flat().join('／'),note=$('oN').value.trim(),price=optPrice();const k=cur.name+opts+note;const f=cart.find(x=>x.k===k);f?f.qty++:cart.push({k,name:cur.name,opts,note,price,qty:1});closeS();upd()}
const total=()=>cart.reduce((s,x)=>s+x.price*x.qty,0);
function upd(){const c=cart.reduce((s,x)=>s+x.qty,0);$('cartBtn').textContent=`購物車（${c}）　NT$${total()}`}
function openCart(){drawCart();$('sCart').classList.add('show')}
function drawCart(){const L=$('cL');L.innerHTML='';if(!cart.length){L.innerHTML='<p style="color:var(--mut)">購物車是空的</p>'}
cart.forEach((x,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<div><b>${esc(x.name)}</b><br><span style="color:var(--mut);font-size:12px">${esc(x.opts)}${x.note?'・'+esc(x.note):''}</span></div>`;const q=document.createElement('div');q.className='q';q.innerHTML=`<button>－</button> ${x.qty} <button>＋</button> NT$${x.price*x.qty}`;const [m,p]=q.querySelectorAll('button');m.onclick=()=>{x.qty--;if(!x.qty)cart.splice(i,1);drawCart();upd()};p.onclick=()=>{x.qty++;drawCart();upd()};r.append(q);L.append(r)});
$('cT').textContent='合計 NT$'+total();$('cF').classList.toggle('hide',!cart.length)}
function closeS(){document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'))}
async function getDb(){if(db)return db;try{db=await claude.use('db')}catch(e){}return db}
async function submitOrder(){const name=$('fN').value.trim(),phone=$('fP').value.trim();
if(!name||!/^[0-9+\-\s]{8,15}$/.test(phone)){$('err').textContent='請填寫姓名與正確的手機號碼';return}
if(!$('when').value){$('err').textContent='請先在頁面上方選擇預約日期與時間';return}
$('err').textContent='';$('sub').disabled=true;
const no='A'+String(Date.now()).slice(-6);
const o={no,name,phone,email:$('fE').value.trim(),note:$('fM').value.trim(),mode,when:$('wd').selectedOptions[0].text+' '+$('wt').selectedOptions[0].text,items:cart.map(({name,opts,note,price,qty})=>({name,opts,note,price,qty})),total:total(),status:'待處理',ts:Date.now()};
let saved=false;try{await fetch('https://script.google.com/macros/s/AKfycbzA_1O85YT5RaoHxt6-0EVkf2Qq2ToAAW_Fq5rXuzODbDWR7oyhWMfgc7Bui28SH3D4/exec',{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});saved=true}catch(e){}
const txt=`【伊利小編購】訂單 ${no}\n${mode}｜${o.when}\n${name} ${phone}\n`+o.items.map(x=>`${x.name}（${x.opts}）x${x.qty} NT$${x.price*x.qty}`).join('\n')+`\n合計 NT$${o.total}`+(o.note?`\n備註：${o.note}`:'');
$('okT').textContent=saved?`訂單編號 ${no}，店家已收到您的訂單，請依預約時間前來取餐。`:`訂單編號 ${no}。目前無法連線至店家系統，請複製下方內容傳給店家確認。`;
$('okS').value=txt;cart=[];upd();$('sub').disabled=false;closeS();$('sOk').classList.add('show')}
async function openAdmin(){$('sAdm').classList.add('show');$('aL').innerHTML='';$('csv').classList.add('hide');
try{user=await claude.use('user')}catch(e){}
const d=await getDb();
if(!d||!(user&&user.canEdit())){$('aMsg').textContent='此頁僅限店家（擁有編輯權限者）登入後查看。';return}
$('aMsg').textContent='即時訂單';$('csv').classList.remove('hide');
if(unsub)unsub();unsub=d.collection('orders').orderBy('ts','desc').onSnapshot(s=>{orders=s.docs.map(x=>x.data());drawAdmin()},e=>{$('aMsg').textContent='讀取失敗：'+e.message})}
function drawAdmin(){const L=$('aL');L.innerHTML='';if(!orders.length){L.innerHTML='<p style="color:var(--mut)">目前沒有訂單</p>';return}
orders.forEach(o=>{const d=document.createElement('div');d.className='o';d.innerHTML=`<div class="row" style="padding:0"><b>${esc(o.no)}・${esc(o.name)}</b><span>NT$${o.total}</span></div><div style="color:var(--mut);font-size:13px">${esc(o.mode)}｜${esc(o.when)}｜${esc(o.phone)}</div>`+o.items.map(x=>`<div>${esc(x.name)}（${esc(x.opts)}）×${x.qty}</div>`).join('')+(o.note?`<div style="color:var(--mut)">備註：${esc(o.note)}</div>`:'');
const b=document.createElement('button');b.style.marginTop='8px';b.textContent=o.status==='待處理'?'標示為已完成':'已完成（點擊還原）';b.className=o.status==='待處理'?'':'on';b.onclick=async()=>{try{await db.doc('orders/'+o.no).update({status:o.status==='待處理'?'已完成':'待處理'})}catch(e){}};d.append(b);L.append(d)})}
async function exportCsv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const rows=[['訂單編號','狀態','取餐方式','預約時間','姓名','手機','Email','餐點','合計','備註','下單時間']].concat(orders.map(o=>[o.no,o.status,o.mode,o.when,o.name,o.phone,o.email,o.items.map(x=>`${x.name}(${x.opts})x${x.qty}`).join('；'),o.total,o.note,new Date(o.ts).toLocaleString('zh-TW')]));
const data='\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n');
try{const dl=await claude.use('downloads');if(dl)await dl.save({filename:'orders.csv',data})}catch(e){}}
renderTabs();upd();
</script></body></html>
